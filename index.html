<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galery Nururrahmi</title>
    <style>
        /* Reset dasar */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Desain Background Granit Blue, White & Pink */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e2a38 0%, #3a6073 35%, #a2c1d1 65%, #f4d8e0 100%);
            background-attachment: fixed;
            color: #333;
            text-align: center;
            padding: 40px 20px;
            min-height: 100vh;
        }

        /* Desain Judul */
        header {
            margin-bottom: 60px; /* Jarak agak jauh ke foto pertama */
            margin-top: 20px;
        }

        h1 {
            font-size: 2.8rem;
            letter-spacing: 2px;
            margin-bottom: 15px;
            font-weight: 800;
            
            /* Efek Teks Gradasi Biru, Putih, Pink */
            background: linear-gradient(to right, #4ca1af, #ffffff, #e6a8b8);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3); 
        }

        p.subtitle {
            color: #ffffff;
            font-size: 1.1rem;
            letter-spacing: 1px;
            font-style: italic;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.4);
        }

        /* Desain Galeri (Disusun ke bawah) */
        .gallery {
            display: flex;
            flex-direction: column; /* Membuat susunan vertikal ke bawah */
            align-items: center;    /* Menaruh foto di tengah */
            gap: 50px;              /* Jarak antar foto ke bawah */
            max-width: 100%;
            margin: 0 auto;
        }

        /* Desain Card Foto */
        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(230, 168, 184, 0.4), 0 5px 15px rgba(44, 62, 80, 0.5);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            /* Lebar maksimal foto di layar besar */
            width: 100%;
            max-width: 400px; 
            backdrop-filter: blur(5px);
        }

        .card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 15px 35px rgba(230, 168, 184, 0.6), 0 10px 25px rgba(44, 62, 80, 0.7);
        }

        /* Pengaturan Ukuran Foto 2:3 */
        .card img {
            width: 100%;
            aspect-ratio: 2 / 3; /* Mengunci rasio lebar 2 dan tinggi 3 */
            object-fit: cover;   /* Agar gambar tidak gepeng, melainkan terpotong rapi */
            border-radius: 10px;
            display: block;
        }

        /* Desain Responsif untuk HP */
        @media (max-width: 768px) {
            h1 {
                font-size: 2rem; 
                line-height: 1.2;
            }
            header {
                margin-bottom: 40px;
            }
            .gallery {
                gap: 30px; /* Jarak antar foto di HP sedikit dirapatkan */
            }
            .card {
                max-width: 90%; /* Di HP, foto memenuhi 90% lebar layar */
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcome To Galery Nururrahmi</h1>
        <p class="subtitle">A collection of moments & memories.</p>
    </header>

    <div class="gallery">
        <!-- Foto 1 (Di dalam mobil) -->
        <div class="card">
            <img src="https://cdn.phototourl.com/member/2026-11-01-b2c73052-06ee-44f3-9463-a9dee9dae509.jpg" alt="Inside the car">
        </div>

        <!-- Foto 2 (Aesthetic selfie) -->
        <div class="card">
            <img src="https://cdn.phototourl.com/member/2026-11-01-b8ba5f3c-b6e6-4d6e-9f4a-2f44a7eaba8c.png" alt="Aesthetic selfie">
        </div>

        <!-- Foto 3 (Hijab putih) -->
        <div class="card">
            <img src="https://cdn.phototourl.com/member/2026-11-01-592017cf-53fb-450d-8dfd-5607d06ec278.png" alt="White hijab portrait">
        </div>
    </div>

</body>
</html>
