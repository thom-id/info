<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri Bimbel Hari Senin</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
        }

        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .card {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            overflow: hidden;
            width: 300px;
            position: relative; /* Penting agar teks bisa menimpa gambar */
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        /* Gambar di dalam kartu */
        .card img {
            width: 100%;
            height: 350px; /* Tinggi tetap agar foto seimbang */
            object-fit: cover;
            display: block;
        }

        /* Kotak teks overlay */
        .overlay-text {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 15px;
            box-sizing: border-box;
            background: rgba(0, 0, 0, 0.6); /* Latar belakang hitam transparan */
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Galeri Foto dengan Teks</h1>

    <div class="gallery">
        
        <!-- Foto 1: Nadia Sakit Mata -->
        <div class="card">
            <img src="https://cdn.phototourl.com/free/2026-09-07-e62e3c26-37cb-4c44-b5b5-cbdcd0543a8b.jpg" alt="Foto HP di atas meja merah">
            <div class="overlay-text">Nadia Sakit Mata</div>
        </div>

        <!-- Foto 2: Afif Ganteng -->
        <div class="card">
            <img src="https://cdn.phototourl.com/free/2026-09-07-ba604272-d72f-49aa-b6ca-82deacc927a3.jpg" alt="Foto Wanita Berhijab">
            <div class="overlay-text">Afif Ganteng</div>
        </div>

    </div>

</body>
</html>
