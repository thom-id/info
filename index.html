<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galery Nururrahmi</title>
    <style>
        /* Reset dasar */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Desain Background Granit Blue & Pink */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e2a38 0%, #3a6073 40%, #d18f9d 100%);
            background-attachment: fixed;
            color: #333;
            text-align: center;
            padding: 40px 20px;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* =========================================
           EFEK BUNGA JATUH (FLOWER RAIN)
           ========================================= */
        .flower-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
            overflow: hidden;
        }

        .flower {
            position: absolute;
            top: -10%;
            font-size: 2rem;
            animation-name: fall;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
            opacity: 0.8;
        }

        /* Animasi jatuh dan bergoyang */
        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg) translateX(0); }
            25% { transform: translateY(25vh) rotate(45deg) translateX(30px); }
            50% { transform: translateY(50vh) rotate(90deg) translateX(-30px); }
            75% { transform: translateY(75vh) rotate(135deg) translateX(30px); }
            100% { transform: translateY(110vh) rotate(360deg) translateX(0); }
        }

        /* Variasi Waktu Jatuh (DIPERCEPAT) */
        .flower:nth-child(1) { left: 10%; animation-duration: 5s; animation-delay: 0s; font-size: 2.5rem; }
        .flower:nth-child(2) { left: 25%; animation-duration: 6.5s; animation-delay: 1s; font-size: 1.8rem; }
        .flower:nth-child(3) { left: 40%; animation-duration: 4.5s; animation-delay: 2.5s; font-size: 2.2rem; }
        .flower:nth-child(4) { left: 55%; animation-duration: 7.5s; animation-delay: 0.5s; font-size: 2rem; }
        .flower:nth-child(5) { left: 70%; animation-duration: 5.5s; animation-delay: 3s; font-size: 2.8rem; }
        .flower:nth-child(6) { left: 85%; animation-duration: 7s; animation-delay: 1.5s; font-size: 1.5rem; }
        .flower:nth-child(7) { left: 15%; animation-duration: 8s; animation-delay: 4s; font-size: 2rem; }
        .flower:nth-child(8) { left: 60%; animation-duration: 5s; animation-delay: 3.5s; font-size: 2.4rem; }
        .flower:nth-child(9) { left: 90%; animation-duration: 6s; animation-delay: 5s; font-size: 1.9rem; }
        .flower:nth-child(10) { left: 35%; animation-duration: 8.5s; animation-delay: 6s; font-size: 2.1rem; }
        .flower:nth-child(11) { left: 50%; animation-duration: 5.5s; animation-delay: 1.2s; font-size: 2.3rem; }
        .flower:nth-child(12) { left: 80%; animation-duration: 7s; animation-delay: 2.8s; font-size: 1.7rem; }

        /* =========================================
           EFEK TEKS BERJALAN (MARQUEE) NURURRAHMI
           ========================================= */
        .marquee-container {
            position: fixed;
            top: 50%;
            left: 0;
            width: 100%;
            transform: translateY(-50%);
            overflow: hidden;
            z-index: -1;
            pointer-events: none;
            opacity: 0.15;
        }

        .marquee-text {
            display: inline-block;
            white-space: nowrap;
            font-size: 8rem;
            font-weight: 900;
            color: #ffffff;
            text-transform: uppercase;
            animation: scrollKanan 20s linear infinite;
        }

        @keyframes scrollKanan {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100vw); }
        }

        /* =========================================
           DESAIN JUDUL UTAMA
           ========================================= */
        header {
            position: relative;
            z-index: 10;
            margin-bottom: 60px;
            margin-top: 20px;
        }

        h1 {
            font-size: 3rem;
            letter-spacing: 2px;
            margin-bottom: 15px;
            font-weight: 800;
            background: linear-gradient(to right, #4ca1af, #ffffff, #e6a8b8);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5); 
        }

        p.subtitle {
            color: #ffffff;
            font-size: 1.2rem;
            letter-spacing: 1px;
            font-style: italic;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
        }

        /* =========================================
           DESAIN GALERI & FOTO
           ========================================= */
        .gallery {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 60px;
            max-width: 100%;
            margin: 0 auto;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4), 0 5px 15px rgba(230, 168, 184, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            width: 100%;
            max-width: 650px;
            backdrop-filter: blur(10px);
        }

        .card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 10px 25px rgba(230, 168, 184, 0.5);
        }

        .card img {
            width: 100%;
            aspect-ratio: 2 / 3;
            object-fit: cover;
            border-radius: 12px;
            display: block;
        }

        /* Desain Responsif untuk HP */
        @media (max-width: 768px) {
            h1 { font-size: 2.2rem; line-height: 1.2; }
            header { margin-bottom: 40px; }
            .marquee-text { font-size: 4rem; }
            .gallery { gap: 40px; }
            .card {
                max-width: 95%;
                padding: 10px;
            }
            .flower { font-size: 1.5rem !important; }
        }
    </style>
</head>
<body>

    <!-- Efek Bunga Jatuh -->
    <div class="flower-container">
        <div class="flower">🌷</div>
        <div class="flower">🌸</div>
        <div class="flower">🌹</div>
        <div class="flower">🌺</div>
        <div class="flower">🌻</div>
        <div class="flower">🌼</div>
        <div class="flower">🪻</div>
        <div class="flower">🪷</div>
        <div class="flower">💐</div>
        <div class="flower">🌸</div>
        <div class="flower">🌷</div>
        <div class="flower">🌹</div>
    </div>

    <!-- Teks Nururrahmi Berjalan di Belakang -->
    <div class="marquee-container">
        <div class="marquee-text">NURURRAHMI • NURURRAHMI • NURURRAHMI • NURURRAHMI • NURURRAHMI • NURURRAHMI • NURURRAHMI •</div>
    </div>

    <!-- Judul Depan -->
    <header>
        <h1>Welcome To Galery Nururrahmi</h1>
        <p class="subtitle">A collection of moments & memories.</p>
    </header>

    <!-- Galeri Foto -->
    <div class="gallery">
        <div class="card">
            <img src="https://cdn.phototourl.com/member/2026-11-01-b2c73052-06ee-44f3-9463-a9dee9dae509.jpg" alt="Inside the car">
        </div>

        <div class="card">
            <img src="https://cdn.phototourl.com/member/2026-11-01-b8ba5f3c-b6e6-4d6e-9f4a-2f44a7eaba8c.png" alt="Aesthetic selfie">
        </div>

        <div class="card">
            <img src="https://cdn.phototourl.com/member/2026-11-01-592017cf-53fb-450d-8dfd-5607d06ec278.png" alt="White hijab portrait">
        </div>
    </div>

</body>
</html>
