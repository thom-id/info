<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THOM</title>

    <!-- SEO & Social Sharing -->
    <meta name="description" content="The less you know, the better.">
    <meta property="og:title" content="THOM">
    <meta property="og:description" content="The less you know, the better.">
    <meta property="og:image" content="https://cdn.phototourl.com/free/2026-08-04-1192ef1c-b388-45d3-8747-9df2928b501d.png">
    <meta name="theme-color" content="#0a0a0a">

    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' style='font-weight:bold'>✦</text></svg>">

    <style>
        /* ===== FONT ===== */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');

        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Arial', sans-serif;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            overflow: hidden;
            touch-action: none;
            overscroll-behavior: none;
            background: #0a0a0a;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            position: fixed;
            inset: 0;
        }

        /* ===== BINTANG BACKGROUND ===== */
        #stars {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration) infinite alternate;
            opacity: 0.3;
        }
        @keyframes twinkle {
            0% { opacity: 0.1; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        /* ===== CARD ===== */
        .card {
            position: relative;
            z-index: 1;
            width: 380px;
            max-width: 92%;
            padding: 32px 28px 28px;
            text-align: center;
            background: rgba(20, 20, 20, 0.75);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            animation: fadeUp 1s ease-out;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== AVATAR ===== */
        .avatar-wrapper {
            margin-bottom: 16px;
        }
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.05);
            display: block;
            margin: 0 auto;
            transition: 0.3s;
        }
        .avatar:hover {
            transform: scale(1.03);
            border-color: rgba(255, 255, 255, 0.3);
        }

        /* ===== USERNAME ===== */
        .username {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #fff;
            margin-bottom: 4px;
        }

        /* ===== BIO ===== */
        .bio {
            font-size: 15px;
            color: #aaa;
            margin-bottom: 18px;
            font-weight: 400;
        }

        /* ===== LAST SEEN ===== */
        .lastseen {
            font-size: 12px;
            color: #666;
            margin-bottom: 22px;
            letter-spacing: 0.3px;
        }
        .lastseen span {
            color: #888;
        }

        /* ===== BUTTONS ===== */
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 24px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 13px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            color: #e0e0e0;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.25s ease;
            text-decoration: none;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            letter-spacing: 0.3px;
        }
        .btn:active {
            transform: scale(0.97);
            background: rgba(255, 255, 255, 0.12);
        }
        .btn .icon {
            font-size: 18px;
        }
        .btn-copy:hover {
            border-color: rgba(255, 255, 255, 0.25);
        }

        /* ===== STATS ===== */
        .stats {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px 16px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 13px;
            color: #888;
        }
        .stats span {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .stats .badge {
            background: rgba(255, 255, 255, 0.06);
            padding: 2px 12px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 11px;
            font-weight: 600;
            color: #ccc;
            letter-spacing: 0.3px;
        }

        /* ===== TOAST ===== */
        #toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(20, 20, 20, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 10px 24px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 13px;
            color: #eee;
            opacity: 0;
            transition: opacity 0.4s ease, transform 0.4s ease;
            pointer-events: none;
            z-index: 99;
            white-space: nowrap;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        #toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <!-- ===== BINTANG ===== -->
    <div id="stars"></div>

    <!-- ===== CARD ===== -->
    <div class="card">
        <!-- Avatar -->
        <div class="avatar-wrapper">
            <img class="avatar"
                 src="https://cdn.phototourl.com/free/2026-08-04-1192ef1c-b388-45d3-8747-9df2928b501d.png"
                 alt="Avatar THOM"
                 onerror="this.src='https://ui-avatars.com/api/?name=THOM&size=100&background=1a1a1a&color=fff&bold=true'">
        </div>

        <!-- Username -->
        <div class="username">𝗧𝗛𝗢𝗠</div>

        <!-- Bio -->
        <div class="bio">✦ The less you know, the better. ✦</div>

        <!-- Last Seen -->
        <div class="lastseen">🕒 last seen <span id="lastSeen">just now</span></div>

        <!-- Tombol -->
        <div class="buttons">
            <button class="btn btn-copy" data-copy="thom_discord">
                <span class="icon">🎮</span> Copy Discord
            </button>
            <button class="btn btn-copy" data-copy="thom_tiktok">
                <span class="icon">💎</span> Copy TikTok
            </button>
            <button class="btn btn-copy" data-copy="https://guns.lol/thom">
                <span class="icon">🔗</span> Copy Profile Link
            </button>
        </div>

        <!-- Statistik -->
        <div class="stats">
            <span>📍 <span id="location">Lithuania</span></span>
            <span>🆔 UID <span id="uid">1,850,070</span></span>
            <span>👁️ Profile Views <span id="views">0</span></span>
            <span class="badge">🏅 HypeSquad Bravery</span>
        </div>
    </div>

    <!-- ===== TOAST ===== -->
    <div id="toast">✅ Tersalin!</div>

    <script>
        // =============================================
        // 1. BINTANG (Partikel halus)
        // =============================================
        (function createStars() {
            const container = document.getElementById('stars');
            for (let i = 0; i < 80; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.setProperty('--duration', (2 + Math.random() * 3) + 's');
                star.style.animationDelay = (Math.random() * 3) + 's';
                star.style.width = (1 + Math.random() * 2) + 'px';
                star.style.height = star.style.width;
                container.appendChild(star);
            }
        })();

        // =============================================
        // 2. LAST SEEN (Otomatis)
        // =============================================
        function updateLastSeen() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('lastSeen').textContent = `today at ${hours}:${minutes}`;
        }
        updateLastSeen();

        // =============================================
        // 3. PROFILE VIEWS (Pakai localStorage)
        // =============================================
        (function updateViews() {
            let views = parseInt(localStorage.getItem('thom_views') || '0');
            views += 1;
            localStorage.setItem('thom_views', views);
            document.getElementById('views').textContent = views;
        })();

        // =============================================
        // 4. TOMBOL COPY + TOAST
        // =============================================
        const toast = document.getElementById('toast');

        document.querySelectorAll('.btn-copy').forEach(btn => {
            btn.addEventListener('click', function() {
                const text = this.dataset.copy;
                navigator.clipboard.writeText(text).then(() => {
                    showToast('✅ Tersalin: ' + text);
                }).catch(() => {
                    // Fallback
                    const area = document.createElement('textarea');
                    area.value = text;
                    document.body.appendChild(area);
                    area.select();
                    document.execCommand('copy');
                    document.body.removeChild(area);
                    showToast('✅ Tersalin: ' + text);
                });
            });
        });

        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toast._hide);
            toast._hide = setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        // =============================================
        // 5. CEGAH SCROLL, ZOOM, DRAG
        // =============================================
        document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
        document.addEventListener('gesturestart', e => e.preventDefault());
        document.addEventListener('dragstart', e => e.preventDefault());
        window.addEventListener('wheel', e => e.preventDefault(), { passive: false });

        // =============================================
        // 6. KONSOLE (Buat gaya)
        // =============================================
        console.log('%c✦ THOM | guns.lol style ✦', 'font-size:16px; font-weight:bold; color:white; background:#0a0a0a; padding:8px 16px; border-radius:8px; border:1px solid #333;');
    </script>
</body>
</html>
